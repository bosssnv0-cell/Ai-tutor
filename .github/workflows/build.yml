name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/aitutor app/src/main/res/layout app/src/main/res/values app/src/main/assets
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/aitutor/
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f 90_lessons_curriculum.json ] && cp 90_lessons_curriculum.json app/src/main/assets/
          rm -f build.gradle

      - name: Create gradle files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AiTutor"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.aitutor'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.aitutor"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.google.mediapipe:tasks-genai:0.10.14'
          }
          EOF

      - name: Create manifest and theme
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="AI Tutor" android:theme="@style/Theme.AiTutor">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AiTutor" parent="Theme.AppCompat.DayNight.NoActionBar"/>
          </resources>
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ai-tutor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
